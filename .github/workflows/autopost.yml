name: Repor vídeos no Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: autopost-tiktok
  cancel-in-progress: false

jobs:
  import-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o baixador
        run: pip install --disable-pip-version-check requests yt-dlp
      - name: Repor a fila do Auto Post
        env:
          AUTOPOST_URL: https://moon-social-scheduler.izadoraavila.chatgpt.site
          AUTOPOST_SECRET: ${{ secrets.AUTOPOST_SECRET }}
        run: python autopost_worker.py
