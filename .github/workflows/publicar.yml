name: Publicar fila do Auto Post

on:
  workflow_dispatch:
    inputs:
      immediate:
        description: "Agendar o próximo vídeo para daqui a 1 minuto"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: autopost-publicacao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Processar vídeos vencidos e atualizar a fila
        env:
          AUTOPOST_SECRET: ${{ secrets.AUTOPOST_SECRET }}
        run: |
          BODY='{}'
          if [ "${{ github.event.inputs.immediate }}" = "true" ]; then
            BODY='{"scheduleNextMinute":true}'
          fi
          curl --fail-with-body --retry 2 --max-time 300 -X POST -H "Authorization: Bearer $AUTOPOST_SECRET" -H "Content-Type: application/json" -d "$BODY" https://moon-social-scheduler.izadoraavila.chatgpt.site/api/publish/run
